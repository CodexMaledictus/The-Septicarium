<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="The Mercy-Sickle reliquary chamber of The Septicarium, a sealed examination of Mortivus Classarion's spear-hafted plague sickle." />
  <title>The Mercy-Sickle | The Septicarium</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root{
      --bg:#050705;
      --bg-2:#090d09;
      --panel:#0d120d;
      --panel-2:#121712;
      --line:rgba(196,168,86,.28);
      --line-bright:rgba(216,190,102,.62);
      --text:#e9dfc5;
      --text-strong:#fff1cf;
      --muted:#b6ab89;
      --dim:#786f59;
      --gold:#c7b06a;
      --gold-hot:#f0d88d;
      --plague:#9dc374;
      --plague-hot:#c9ee86;
      --plague-2:#6d8e49;
      --warning:#d4a056;
      --blood:#7c2d22;
      --shadow:0 30px 92px rgba(0,0,0,.58);
      --radius:30px;
      --radius-sm:20px;
      --max:1520px;
      --ease:cubic-bezier(.2,.8,.2,1);
    }

    *{box-sizing:border-box}
    html{scroll-behavior:smooth}

    body{
      margin:0;
      min-height:100vh;
      overflow-x:hidden;
      color:var(--text);
      font-family:"JetBrains Mono", ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      background:
        radial-gradient(circle at 20% 10%, rgba(117,144,69,.13), transparent 26%),
        radial-gradient(circle at 80% 12%, rgba(210,157,65,.09), transparent 24%),
        radial-gradient(circle at 50% 72%, rgba(105,141,76,.09), transparent 34%),
        linear-gradient(180deg,#050705 0%,#090d09 46%,#040604 100%);
      transition:background .65s var(--ease), filter .65s var(--ease);
    }

    body.locked{overflow:hidden}

    body[data-risk="sealed"]{
      background:
        radial-gradient(circle at 20% 10%, rgba(117,144,69,.13), transparent 26%),
        radial-gradient(circle at 80% 12%, rgba(210,157,65,.09), transparent 24%),
        linear-gradient(180deg,#050705 0%,#090d09 46%,#040604 100%);
    }

    body[data-risk="stirring"]{
      background:
        radial-gradient(circle at 16% 8%, rgba(117,144,69,.16), transparent 26%),
        radial-gradient(circle at 80% 12%, rgba(210,157,65,.11), transparent 25%),
        radial-gradient(circle at 54% 76%, rgba(157,195,116,.10), transparent 36%),
        linear-gradient(180deg,#040704 0%,#0a1008 48%,#030503 100%);
    }

    body[data-risk="hazard"]{
      background:
        radial-gradient(circle at 16% 8%, rgba(157,195,116,.21), transparent 27%),
        radial-gradient(circle at 82% 12%, rgba(210,157,65,.08), transparent 25%),
        radial-gradient(circle at 50% 82%, rgba(124,45,34,.12), transparent 38%),
        linear-gradient(180deg,#030503 0%,#071105 50%,#020402 100%);
    }

    body[data-risk="critical"]{
      background:
        radial-gradient(circle at 14% 8%, rgba(157,195,116,.28), transparent 29%),
        radial-gradient(circle at 82% 12%, rgba(240,216,141,.08), transparent 25%),
        radial-gradient(circle at 50% 82%, rgba(124,45,34,.18), transparent 40%),
        linear-gradient(180deg,#020302 0%,#061504 52%,#010201 100%);
    }

    a{color:inherit}
    button{font:inherit}
    ::selection{background:rgba(240,216,141,.28);color:var(--text-strong)}
    h1,h2,h3,h4{font-family:"Cinzel", Georgia, serif}

    .label,
    .kicker,
    .chip,
    .btn,
    .nav a,
    .nav button,
    .readout-label,
    .small-note,
    .node-label,
    .ledger-key{
      font-family:"Inter",system-ui,sans-serif;
      text-transform:uppercase;
      letter-spacing:.18em;
      font-weight:900;
    }

    #sporeCanvas,
    #bladeAuraCanvas,
    #edgeMemoryCanvas{
      position:fixed;
      inset:0;
      width:100%;
      height:100%;
      pointer-events:none;
    }

    #sporeCanvas{
      z-index:0;
      opacity:.84;
    }

    #bladeAuraCanvas{
      z-index:0;
      opacity:.42;
      mix-blend-mode:screen;
    }

    #edgeMemoryCanvas{
      z-index:0;
      opacity:.50;
      mix-blend-mode:screen;
    }

    .grain,
    .scanline{
      position:fixed;
      inset:0;
      pointer-events:none;
      z-index:1;
    }

    .grain{
      opacity:.07;
      background-image:
        radial-gradient(circle at 20% 30%, rgba(255,255,255,.55) 0 1px, transparent 1px),
        radial-gradient(circle at 70% 80%, rgba(255,255,255,.38) 0 1px, transparent 1px),
        radial-gradient(circle at 80% 10%, rgba(255,255,255,.48) 0 1px, transparent 1px),
        radial-gradient(circle at 10% 90%, rgba(255,255,255,.30) 0 1px, transparent 1px);
      background-size:190px 190px,230px 230px,260px 260px,300px 300px;
      mix-blend-mode:screen;
    }

    .scanline{
      opacity:.14;
      background:
        repeating-linear-gradient(to bottom, rgba(240,216,141,.033) 0px, rgba(240,216,141,.033) 1px, transparent 2px, transparent 6px);
      mix-blend-mode:screen;
    }

    .skip-link{
      position:absolute;
      top:-80px;
      left:16px;
      z-index:300;
      padding:12px 16px;
      border-radius:999px;
      background:var(--gold-hot);
      color:#151007;
      font-weight:900;
      text-decoration:none;
      transition:.2s ease;
    }

    .skip-link:focus{top:16px}

    .boot-overlay{
      position:fixed;
      inset:0;
      z-index:200;
      display:grid;
      place-items:center;
      padding:22px;
      background:
        radial-gradient(circle at center, rgba(25,32,25,.76), rgba(3,5,3,.96)),
        linear-gradient(180deg, rgba(92,113,57,.08), rgba(0,0,0,.82));
      transition:opacity .75s var(--ease), visibility .75s var(--ease);
    }

    .boot-overlay.hidden{
      opacity:0;
      visibility:hidden;
      pointer-events:none;
    }

    .boot-shell{
      width:min(900px,100%);
      border:1px solid var(--line-bright);
      border-radius:30px;
      background:linear-gradient(180deg,rgba(11,16,11,.96),rgba(6,9,6,.98));
      box-shadow:0 0 0 1px rgba(197,168,84,.12) inset,var(--shadow);
      padding:28px;
      position:relative;
      overflow:hidden;
    }

    .boot-shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(90deg,transparent 0,rgba(194,173,90,.08) 50%,transparent 100%);
      animation:scanSweep 2.4s linear infinite;
      pointer-events:none;
    }

    @keyframes scanSweep{
      from{transform:translateX(-100%)}
      to{transform:translateX(100%)}
    }

    .boot-inner{
      position:relative;
      z-index:2;
    }

    .boot-kicker{
      color:var(--gold-hot);
      font-size:.76rem;
      margin-bottom:18px;
    }

    .boot-title{
      font-size:clamp(2.4rem,6vw,5.6rem);
      line-height:.88;
      margin:0 0 18px;
      color:#efe7cf;
      letter-spacing:.045em;
    }

    .boot-text{
      color:var(--muted);
      font-size:1rem;
      max-width:68ch;
      line-height:1.75;
      margin:0 0 18px;
    }

    .boot-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:10px;
      margin-bottom:16px;
    }

    .boot-cell{
      border:1px solid rgba(196,168,86,.25);
      border-radius:18px;
      background:rgba(8,11,8,.72);
      padding:13px;
      min-height:108px;
    }

    .boot-cell .label{
      color:var(--gold-hot);
      font-size:.56rem;
      margin-bottom:8px;
    }

    .boot-cell strong{
      display:block;
      color:#d9d0b3;
      font-size:.9rem;
      line-height:1.45;
      font-weight:600;
    }

    .boot-cell.rot .label,
    .boot-cell.rot strong{
      color:var(--plague-hot);
    }

    .boot-log{
      border:1px solid var(--line);
      border-radius:18px;
      background:rgba(8,11,8,.82);
      padding:14px 16px;
      min-height:104px;
      display:grid;
      gap:8px;
      margin-bottom:16px;
      color:#d9d0b3;
      font-size:.92rem;
    }

    .boot-log-line{
      display:flex;
      gap:10px;
      align-items:flex-start;
      opacity:0;
      transform:translateY(8px);
      animation:rise .28s var(--ease) forwards;
    }

    .boot-log-line::before{
      content:"⟐";
      color:var(--plague);
      flex:0 0 auto;
      margin-top:1px;
    }

    @keyframes rise{
      to{opacity:1;transform:none}
    }

    .boot-progress{
      height:10px;
      border:1px solid var(--line);
      border-radius:999px;
      background:rgba(0,0,0,.45);
      overflow:hidden;
      margin-bottom:12px;
    }

    .boot-progress span{
      display:block;
      height:100%;
      width:0%;
      background:linear-gradient(90deg,var(--plague-2),var(--gold-hot),var(--plague-hot));
      box-shadow:0 0 22px rgba(183,171,93,.28);
      transition:width .25s ease;
    }

    .boot-foot{
      display:flex;
      justify-content:space-between;
      gap:12px;
      flex-wrap:wrap;
      color:var(--muted);
      font-size:.78rem;
    }

    .site-shell{
      width:min(var(--max),calc(100% - 28px));
      margin:0 auto;
      position:relative;
      z-index:5;
      padding:16px 0 74px;
    }

    .top-shell{
      position:sticky;
      top:10px;
      z-index:70;
      display:grid;
      gap:8px;
      margin-bottom:16px;
    }

    .topbar,
    .relic-meter{
      border:1px solid rgba(196,168,86,.24);
      border-radius:24px;
      background:rgba(8,11,8,.78);
      backdrop-filter:blur(14px);
      box-shadow:0 14px 40px rgba(0,0,0,.34);
    }

    .topbar{
      display:grid;
      grid-template-columns:1fr auto;
      gap:14px;
      align-items:center;
      padding:12px 14px;
    }

    .crumbs{
      display:flex;
      flex-wrap:wrap;
      gap:10px;
      align-items:center;
      font-size:.68rem;
      color:var(--muted);
      line-height:1.65;
    }

    .crumbs a{
      color:#d7cca9;
      text-decoration:none;
      border-bottom:1px solid transparent;
    }

    .crumbs a:hover{border-color:#d7cca9}
    .crumbs .sep{opacity:.45}

    .nav{
      display:flex;
      gap:7px;
      flex-wrap:wrap;
      justify-content:flex-end;
    }

    .nav a,
    .nav button{
      font-size:.60rem;
      color:#e9e0c6;
      text-decoration:none;
      border:1px solid rgba(196,168,86,.25);
      border-radius:999px;
      background:rgba(14,17,10,.72);
      padding:9px 10px;
      cursor:pointer;
      transition:.2s var(--ease);
    }

    .nav a:hover,
    .nav button:hover{
      transform:translateY(-2px);
      border-color:var(--line-bright);
      background:rgba(42,33,16,.82);
    }

    .relic-meter{
      padding:10px 12px;
      display:grid;
      grid-template-columns:160px 1fr 160px;
      gap:12px;
      align-items:center;
    }

    .readout-label{
      color:var(--gold-hot);
      font-size:.58rem;
      margin-bottom:5px;
    }

    .readout-value{
      color:#e8d7af;
      font-size:.86rem;
      line-height:1.35;
    }

    .meter-bars{
      display:grid;
      gap:7px;
    }

    .bar-row{
      display:grid;
      grid-template-columns:126px 1fr 45px;
      gap:10px;
      align-items:center;
    }

    .bar-row .label{
      font-size:.54rem;
      color:var(--gold-hot);
    }

    .bar-row.rot .label{
      color:var(--plague-hot);
    }

    .bar-shell{
      height:10px;
      border:1px solid rgba(196,168,86,.18);
      border-radius:999px;
      background:rgba(255,255,255,.05);
      overflow:hidden;
    }

    .bar-fill{
      height:100%;
      width:var(--w);
      background:linear-gradient(90deg,var(--gold),var(--gold-hot));
      transition:width .45s var(--ease);
    }

    .bar-row.rot .bar-fill{
      background:linear-gradient(90deg,var(--plague-2),var(--plague),var(--plague-hot));
    }

    .bar-num{
      color:#d8c8a3;
      font-size:.72rem;
      text-align:right;
    }

    .hero{
      position:relative;
      min-height:84vh;
      border:1px solid var(--line);
      border-radius:34px;
      overflow:hidden;
      box-shadow:var(--shadow);
      isolation:isolate;
      display:grid;
      grid-template-columns:1.05fr .95fr;
      gap:24px;
      padding:clamp(20px,3.4vw,48px);
      background:#050605;
    }

    .hero::before{
      content:"";
      position:absolute;
      inset:0;
      z-index:-2;
      background:
        linear-gradient(100deg, rgba(4,6,4,.96) 0%, rgba(6,8,6,.82) 42%, rgba(6,8,6,.35) 76%, rgba(4,6,4,.88) 100%),
        url("Assets/Mercy-Sickle/mercy-sickle-hero.jpeg") center/cover no-repeat;
      transform:scale(1.035);
      filter:contrast(1.06) saturate(.96);
      transition:transform .8s var(--ease),filter .8s var(--ease);
    }

    .hero:hover::before{
      transform:scale(1.065);
      filter:contrast(1.08) saturate(1.04);
    }

    .hero::after{
      content:"";
      position:absolute;
      inset:0;
      z-index:-1;
      background:
        radial-gradient(circle at 20% 42%,rgba(199,176,106,.22),transparent 25%),
        radial-gradient(circle at 80% 38%,rgba(157,195,116,.16),transparent 30%),
        linear-gradient(180deg,transparent 25%,rgba(0,0,0,.76));
      pointer-events:none;
    }

    .hero-left,
    .hero-right{
      display:flex;
      flex-direction:column;
      justify-content:flex-end;
      min-height:calc(84vh - 96px);
    }

    .eyebrow,
    .kicker{
      color:var(--gold-hot);
      font-size:.74rem;
      line-height:1.65;
      margin-bottom:14px;
    }

    h1{
      margin:0 0 16px;
      font-size:clamp(3.2rem,8.2vw,7.4rem);
      line-height:.86;
      letter-spacing:.035em;
      color:#f0e8d1;
      text-shadow:0 14px 38px rgba(0,0,0,.66);
    }

    .hero-sub{
      font-family:"Cinzel",Georgia,serif;
      font-size:clamp(1.35rem,2.5vw,2.2rem);
      color:var(--plague-hot);
      font-style:italic;
      line-height:1.12;
      max-width:28ch;
      margin:0 0 18px;
    }

    .hero-copy{
      font-family:"Cinzel",Georgia,serif;
      font-size:1.08rem;
      line-height:1.86;
      color:#ddd3b8;
      max-width:72ch;
      margin:0 0 18px;
    }

    .hero-actions{
      display:flex;
      flex-wrap:wrap;
      gap:11px;
      margin-top:22px;
    }

    .btn{
      border:1px solid rgba(196,168,86,.38);
      border-radius:999px;
      color:#f3dfba;
      background:linear-gradient(180deg,rgba(196,168,86,.14),rgba(9,12,8,.86));
      text-decoration:none;
      padding:13px 15px;
      font-size:.67rem;
      cursor:pointer;
      transition:.22s var(--ease);
      display:inline-flex;
      align-items:center;
      justify-content:center;
      gap:8px;
    }

    .btn:hover{
      transform:translateY(-2px);
      border-color:var(--line-bright);
      background:linear-gradient(180deg,rgba(196,168,86,.22),rgba(27,31,16,.92));
      box-shadow:0 18px 40px rgba(0,0,0,.34);
    }

    .btn.rot{
      border-color:rgba(157,195,116,.44);
      background:linear-gradient(180deg,rgba(157,195,116,.16),rgba(9,20,7,.86));
    }

    .hero-grid{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:10px;
    }

    .card,
    .info-card,
    .image-frame,
    .panel,
    .part-card,
    .lore-card,
    .effect-card,
    .quote,
    .stage-card,
    .motion-card,
    .origin-choice,
    .witness-card,
    .status-row,
    .modal-frame,
    .custody-step,
    .reliquary-slab,
    .ritual-node,
    .scar-row,
    .reference-card{
      border:1px solid var(--line);
      border-radius:24px;
      background:linear-gradient(180deg,rgba(13,17,13,.86),rgba(6,9,6,.92));
      box-shadow:var(--shadow);
      position:relative;
      overflow:hidden;
    }

    .card::before,
    .info-card::before,
    .panel::before,
    .part-card::before,
    .lore-card::before,
    .effect-card::before,
    .quote::before,
    .stage-card::before,
    .motion-card::before,
    .origin-choice::before,
    .witness-card::before,
    .status-row::before,
    .custody-step::before,
    .reliquary-slab::before,
    .ritual-node::before,
    .scar-row::before,
    .reference-card::before{
      content:"";
      position:absolute;
      inset:0;
      pointer-events:none;
      background:linear-gradient(90deg,transparent,rgba(240,216,141,.055),transparent);
      transform:translateX(-105%);
      animation:sweep 10s linear infinite;
      opacity:.55;
    }

    @keyframes sweep{
      to{transform:translateX(105%)}
    }

    .info-card{
      padding:16px;
      min-height:128px;
      cursor:pointer;
      transition:.24s var(--ease);
    }

    .info-card:hover,
    .card:hover,
    .lore-card:hover,
    .effect-card:hover,
    .witness-card:hover,
    .stage-card:hover,
    .reference-card:hover{
      transform:translateY(-4px);
      border-color:var(--line-bright);
    }

    .info-card .label{
      font-size:.62rem;
      color:var(--gold-hot);
      margin-bottom:10px;
    }

    .info-card strong{
      display:block;
      font-family:"Cinzel",Georgia,serif;
      font-size:1.14rem;
      line-height:1.12;
      color:#efe6ce;
      margin-bottom:8px;
    }

    .info-card p{
      margin:0;
      color:var(--muted);
      line-height:1.58;
      font-size:.94rem;
    }

    .hero-right{gap:14px}

    .hero-media{
      height:520px;
      display:grid;
      grid-template-rows:1fr auto;
      gap:12px;
    }

    .hero-main-img{min-height:360px}

    .image-frame{
      background:#050605;
      display:grid;
      grid-template-rows:1fr auto;
      box-shadow:var(--shadow);
    }

    .image-frame img{
      width:100%;
      height:100%;
      object-fit:cover;
      display:block;
      filter:contrast(1.05) saturate(.96);
      transition:transform .65s var(--ease),filter .65s var(--ease);
    }

    .image-frame:hover img{
      transform:scale(1.04);
      filter:contrast(1.08) saturate(1.05);
    }

    .frame-caption{
      padding:12px 14px;
      border-top:1px solid var(--line);
      background:rgba(4,6,4,.84);
      color:#eadfc0;
      font-size:.62rem;
      line-height:1.5;
    }

    .mini-strip{
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:12px;
    }

    .mini-strip .image-frame{height:170px}

    .section{padding-top:36px}

    .section-block{
      border:1px solid var(--line);
      border-radius:32px;
      background:linear-gradient(180deg,rgba(9,12,9,.78),rgba(7,9,7,.92));
      box-shadow:var(--shadow);
      overflow:hidden;
    }

    .section-header{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap:18px;
      flex-wrap:wrap;
      padding:26px 26px 0;
      margin-bottom:18px;
    }

    .section-title{
      margin:0;
      color:#efe6ce;
      font-size:clamp(2.1rem,5vw,4.2rem);
      line-height:.94;
      letter-spacing:.035em;
    }

    .section-desc{
      margin:11px 0 0;
      max-width:86ch;
      color:#bdb08d;
      font-family:"Cinzel",Georgia,serif;
      line-height:1.84;
      font-size:1.03rem;
    }

    .chip{
      color:var(--plague-hot);
      border:1px solid rgba(157,195,116,.32);
      border-radius:999px;
      background:rgba(10,22,7,.60);
      padding:10px 12px;
      font-size:.58rem;
      white-space:nowrap;
    }

    .wide-pad{padding:24px 26px 28px}

    .readout-grid{
      display:grid;
      grid-template-columns:repeat(4,minmax(0,1fr));
      gap:14px;
      padding:24px 26px 28px;
    }

    .readout-card{
      padding:18px;
      min-height:220px;
      cursor:pointer;
    }

    .readout-card h3{
      font-size:1.5rem;
      margin:8px 0 10px;
      color:#efe6ce;
      line-height:1.05;
    }

    .readout-card p{
      font-family:"Cinzel",Georgia,serif;
      color:#d8ceb2;
      line-height:1.72;
      margin:0;
    }

    .revealed-line{
      max-height:0;
      overflow:hidden;
      opacity:0;
      transition:.45s var(--ease);
      border-top:1px dotted rgba(196,168,86,.20);
      padding-top:0;
      margin-top:0;
      color:#d7c8a4;
      font-family:"Cinzel",Georgia,serif;
      line-height:1.75;
    }

    let bootIndex = 0;

    function advanceBoot(){
      if(bootIndex < bootLines.length){
        const line = document.createElement("div");

        line.textContent = bootLines[bootIndex];

        bootBar.style.width = `${(bootIndex / bootLines.length) * 100}%`;
      } else {
        clearInterval(bootTimer);
        setTimeout(closeBoot, 650);
      }
    }

    function closeBoot(){
      bootOverlay.classList.add("hidden");
      document.body.classList.remove("locked");
      setTimeout(() => bootOverlay.remove(), 900);
    }

    const bootTimer = setInterval(advanceBoot, 430);

    skipBoot.addEventListener("click", () => {
      clearInterval(bootTimer);
      while(bootIndex < bootLines.length) advanceBoot();

    const whisperText = document.getElementById("whisperText");

      edgeFill.style.setProperty("--w",`${currentRisk}%`);
      integrityNum.textContent = `${integrity}%`;
      edgeNum.textContent = `${currentRisk}%`;

        document.body.dataset.risk = "sealed";

        witnessSafety.textContent = "Acceptable distance maintained.";

        chamberState.textContent = "Edge-memory stirring.";
        witnessSafety.textContent = "Witness line has moved.";

        witnessSafety.textContent = "Do not interpret the curve.";

        phase:"Phase I // Perfumed Entry",
        title:"The Enemy Arrived Like Choreography",
        text:"The first line broke beneath speed, perfume, and song. The enemy mistook movement for inevitability.",
        advantage:"Speed and sensory overload",
        answer:"Patience and positional denial"
      },
      wound:{
        img:"Assets/Mercy-Sickle/battle-perfumed-refusal-2.jpeg",
        phase:"Phase II // Mortivus Wounded",
        title:"The Champion Reached Him",
        text:"The Slaaneshi champion cut deep enough to become part of the record. Mortivus gave ground without surrendering shape.",
        advantage:"Precision strike and ecstatic aggression",
        answer:"Yielding without opening"
      },
      hook:{
        img:"Assets/Mercy-Sickle/battle-perfumed-refusal-3.jpeg",
        phase:"Phase III // The Hook Turns",
        title:"The Inner Bite Found Motion",
        text:"The Mercy-Sickle did not chase speed. It let speed arrive, then made the arriving motion betray itself.",
        advantage:"Forward momentum",
        answer:"Inner bite and rotational draw"
      },
      lesson:{
        img:"Assets/Mercy-Sickle/battle-perfumed-refusal-4.jpeg",
        phase:"Phase IV // Perfume Becomes Instruction",
        title:"The Corridor Learned",
        text:"By the end, the air no longer belonged to perfume, song, or speed. It belonged to the lesson the blade had made visible.",
        advantage:"Aesthetic terror",
        answer:"Public doctrinal ending"
      }
    };

    const battleImage = document.getElementById("battleImage");
    const battlePhase = document.getElementById("battlePhase");
    const battleTitleText = document.getElementById("battleTitleText");
    const battleText = document.getElementById("battleText");
    const enemyAdvantage = document.getElementById("enemyAdvantage");
    const bladeAnswer = document.getElementById("bladeAnswer");

    document.querySelectorAll(".thumb-btn").forEach(button => {
      button.addEventListener("click", () => {
        document.querySelectorAll(".thumb-btn").forEach(b => b.classList.remove("active"));
        button.classList.add("active");
        const data = battleData[button.dataset.battle];
        battleImage.src = data.img;
        battlePhase.textContent = data.phase;
        battleTitleText.textContent = data.title;
        battleText.textContent = data.text;
        enemyAdvantage.textContent = data.advantage;
        bladeAnswer.textContent = data.answer;
        whisperText.textContent = data.text;
        setRisk(currentRisk + 5);
      });
    });

    const modal = document.getElementById("modal");
    const modalLabel = document.getElementById("modalLabel");
    const modalTitle = document.getElementById("modalTitle");
    const modalText = document.getElementById("modalText");

    function openModal(label,title,text){
      modalLabel.textContent = label;
      modalTitle.textContent = title;
      modalText.textContent = text;
      modal.classList.add("show");
      modal.setAttribute("aria-hidden","false");
    }

    function closeModal(){
      modal.classList.remove("show");
      modal.setAttribute("aria-hidden","true");
    }

    document.querySelectorAll(".interactive").forEach(item => {
      item.addEventListener("click", () => {
        openModal("Reliquary Annotation", item.dataset.title || "Record", item.dataset.text || "The chamber answers.");
        setRisk(currentRisk + 3);
      });
    });

    document.getElementById("closeModal").addEventListener("click", closeModal);
    modal.addEventListener("click", event => {
      if(event.target === modal) closeModal();
    });

    document.addEventListener("keydown", event => {
      if(event.key === "Escape") closeModal();
    });

    const whisperBox = document.getElementById("whisperBox");
    document.getElementById("whisperButton").addEventListener("click", () => {
      whisperBox.style.display = "block";
      whisperText.textContent = "The weapon is most dangerous when everyone understands who has been selected.";
    });

    document.getElementById("closeWhisper").addEventListener("click", () => {
      whisperBox.style.display = "none";
    });

    const canvas = document.getElementById("sporeCanvas");
    const ctx = canvas.getContext("2d");
    let spores = [];
    let mouse = {x:window.innerWidth/2,y:window.innerHeight/2};

    function resizeCanvas(){
      const ratio = Math.min(window.devicePixelRatio || 1,2);
      canvas.width = Math.floor(window.innerWidth * ratio);
      canvas.height = Math.floor(window.innerHeight * ratio);
      canvas.style.width = window.innerWidth + "px";
      canvas.style.height = window.innerHeight + "px";
      ctx.setTransform(ratio,0,0,ratio,0,0);
      spores = Array.from({length:Math.min(150,Math.floor(window.innerWidth/10))},() => ({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        r:Math.random()*2.3+.55,
        s:Math.random()*.32+.08,
        a:Math.random()*Math.PI*2,
        drift:Math.random()*.3+.08,
        type:Math.random()>.72?"rot":"gold"
      }));
    }

    function drawSpores(){
      ctx.clearRect(0,0,window.innerWidth,window.innerHeight);
      for(const spore of spores){
        const dx = mouse.x - spore.x;
        const dy = mouse.y - spore.y;
        const dist = Math.hypot(dx,dy);
        if(dist < 130){
          spore.x -= dx*.0018;
          spore.y -= dy*.0018;
        }

        spore.y -= spore.s;
        spore.x += Math.sin(spore.a)*spore.drift;
        spore.a += .01;

        if(spore.y < -10){
          spore.y = window.innerHeight+10;
          spore.x = Math.random()*window.innerWidth;
        }
        if(spore.x < -15) spore.x = window.innerWidth+15;
        if(spore.x > window.innerWidth+15) spore.x = -15;

        const color = spore.type === "rot" ? "157,195,116" : "240,216,141";
        const g = ctx.createRadialGradient(spore.x,spore.y,0,spore.x,spore.y,spore.r*7);
        g.addColorStop(0,`rgba(${color},${0.10 + spore.r/28})`);
        g.addColorStop(.45,`rgba(${color},.05)`);
        g.addColorStop(1,`rgba(${color},0)`);
        ctx.fillStyle = g;
        ctx.beginPath();
        ctx.arc(spore.x,spore.y,spore.r*5.2,0,Math.PI*2);
        ctx.fill();
      }
      requestAnimationFrame(drawSpores);
    }

    window.addEventListener("resize", resizeCanvas);
    window.addEventListener("mousemove", event => {
      mouse.x = event.clientX;
      mouse.y = event.clientY;
    });

    resizeCanvas();
    drawSpores();

    const custodyData = {
      distance:{
        title:"Witness Distance",
        text:"No attendant stands directly in line with the inner bite. The weapon is studied at an angle so that its curve cannot complete a visual selection.",
        risk:46,
        whisper:"The glass does not protect the witness. The angle does."
      },
      venting:{
        title:"Edge-Memory Venting",
        text:"The chamber slowly bleeds particulate memory into archive capture, preventing the cutting edge from accumulating too much witness pressure at once.",
        risk:58,
        whisper:"The edge remembers best when the room is too still."
      },
      denial:{
        title:"Symbolic Denial",
        text:"Scribes are ordered to describe the weapon physically before describing it spiritually. Shape comes first. Metaphor is permitted only after the haft, collar, and blade have been named correctly.",
        risk:64,
        whisper:"Do not call it beautiful before calling it accurate."
      }
    };

    const custodyTitleOut = document.getElementById("custodyTitleOut");
    const custodyTextOut = document.getElementById("custodyTextOut");

    document.querySelectorAll(".custody-step").forEach(step => {
      step.addEventListener("click", () => {
        document.querySelectorAll(".custody-step").forEach(s => s.classList.remove("active"));
        step.classList.add("active");
        const data = custodyData[step.dataset.custody];
        if(data){
          custodyTitleOut.textContent = data.title;
          custodyTextOut.textContent = data.text;
          whisperText.textContent = data.whisper;
          setRisk(data.risk);
        }
      });
    });

    document.querySelectorAll(".reliquary-slab").forEach(slab => {
      slab.addEventListener("click", () => {
        document.querySelectorAll(".reliquary-slab").forEach(s => s.classList.remove("active"));
        slab.classList.add("active");
        setRisk(54);
        whisperText.textContent = "The large plate gives the weapon back its correct scale.";
      });
    });

    const riteData = {
      reach:["Rite I","Reach","The haft extends judgment into the space between Mortivus and the chosen target. Before blood moves, the battlefield understands that someone has been selected.",52],
      pause:["Rite II","Pause","The weapon waits long enough for refusal to become visible. The pause is not hesitation. It is exposure.",60],
      hook:["Rite III","Hook","The inner bite catches the place where movement insists it is still free. Resistance becomes leverage.",70],
      draw:["Rite IV","Draw","Mortivus pulls the target into the lesson. The body follows the argument the weapon has already made.",78],
      seal:["Rite V","Seal","The cut completes the sentence and returns the blade to witness-position. The ring remembers the ending.",84]
    };

    const riteLabel = document.getElementById("riteLabel");
    const riteTitle = document.getElementById("riteTitle");
    const riteText = document.getElementById("riteText");

    document.querySelectorAll(".ritual-node").forEach(node => {
      node.addEventListener("click", () => {
        document.querySelectorAll(".ritual-node").forEach(n => n.classList.remove("active"));
        node.classList.add("active");
        const r = riteData[node.dataset.rite];
        if(r){
          riteLabel.textContent = r[0];
          riteTitle.textContent = r[1];
          riteText.textContent = r[2];
          setRisk(r[3]);
          whisperText.textContent = r[2];
        }
      });
    });

    const scarWhispers = {
      command:"A commander cut correctly becomes a message faster than a corpse.",
      priest:"Faith can be caught behind the ribs if the symbol breaks first.",
      duelist:"Speed is allowed to become vanity before the hook answers.",
      survivor:"A visible ending can be more useful than an ending granted."
    };

    document.querySelectorAll(".scar-row").forEach(row => {
      row.addEventListener("click", () => {
        document.querySelectorAll(".scar-row").forEach(r => r.classList.remove("active"));
        row.classList.add("active");
        whisperText.textContent = scarWhispers[row.dataset.scar] || "The scar-ledger updates without ink.";
        setRisk(76);
      });
    });

    const bladeAuraCanvas = document.getElementById("bladeAuraCanvas");
    const edgeMemoryCanvas = document.getElementById("edgeMemoryCanvas");
    const bladeAuraCtx = bladeAuraCanvas.getContext("2d");
    const edgeMemoryCtx = edgeMemoryCanvas.getContext("2d");

    let auraMarks = [];
    let edgeThreads = [];

    function resizeExpansionCanvases(){
      const ratio = Math.min(window.devicePixelRatio || 1, 2);

      for(const c of [bladeAuraCanvas, edgeMemoryCanvas]){
        c.width = Math.floor(window.innerWidth * ratio);
        c.height = Math.floor(window.innerHeight * ratio);
        c.style.width = window.innerWidth + "px";
        c.style.height = window.innerHeight + "px";
      }

      bladeAuraCtx.setTransform(ratio,0,0,ratio,0,0);
      edgeMemoryCtx.setTransform(ratio,0,0,ratio,0,0);

      auraMarks = Array.from({length:Math.min(28,Math.floor(window.innerWidth/54))}, () => ({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        r:Math.random()*150+70,
        a:Math.random()*Math.PI*2,
        s:Math.random()*.003+.001
      }));

      edgeThreads = Array.from({length:Math.min(42,Math.floor(window.innerWidth/34))}, () => ({
        x:Math.random()*window.innerWidth,
        y:Math.random()*window.innerHeight,
        len:Math.random()*120+50,
        life:Math.random()*120,
        spd:Math.random()*.8+.25
      }));
    }

    function drawExpansionCanvases(){
      bladeAuraCtx.clearRect(0,0,window.innerWidth,window.innerHeight);
      edgeMemoryCtx.clearRect(0,0,window.innerWidth,window.innerHeight);

      for(const mark of auraMarks){
        mark.a += mark.s;
        const x = mark.x + Math.sin(mark.a)*18;
        const y = mark.y + Math.cos(mark.a*.8)*12;
        const g = bladeAuraCtx.createRadialGradient(x,y,0,x,y,mark.r);
        g.addColorStop(0,"rgba(157,195,116,.055)");
        g.addColorStop(.45,"rgba(240,216,141,.025)");
        g.addColorStop(1,"rgba(0,0,0,0)");
        bladeAuraCtx.fillStyle = g;
        bladeAuraCtx.beginPath();
        bladeAuraCtx.arc(x,y,mark.r,0,Math.PI*2);
        bladeAuraCtx.fill();
      }

      for(const thread of edgeThreads){
        thread.life += thread.spd;
        if(thread.life > 140){
          thread.life = 0;
          thread.x = Math.random()*window.innerWidth;
          thread.y = Math.random()*window.innerHeight;
        }

        const pulse = Math.sin(thread.life/140*Math.PI);
        if(pulse <= 0) continue;

        edgeMemoryCtx.strokeStyle = `rgba(240,216,141,${0.12*pulse})`;
        edgeMemoryCtx.lineWidth = 1;
        edgeMemoryCtx.beginPath();
        edgeMemoryCtx.moveTo(thread.x,thread.y);
        edgeMemoryCtx.lineTo(thread.x+thread.len,thread.y+Math.sin(thread.life*.04)*16);
        edgeMemoryCtx.stroke();

        edgeMemoryCtx.strokeStyle = `rgba(157,195,116,${0.06*pulse})`;
        edgeMemoryCtx.beginPath();
        edgeMemoryCtx.arc(thread.x,thread.y,8+pulse*13,0,Math.PI*2);
        edgeMemoryCtx.stroke();
      }

      requestAnimationFrame(drawExpansionCanvases);
    }

    window.addEventListener("resize", resizeExpansionCanvases);
    resizeExpansionCanvases();
    drawExpansionCanvases();
  </script>
</body>
</html>
